<!DOCTYPE html>
<html>
<head>
  <title>Fortnite Predators</title>
  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: black;
      color: white;
      text-align: center;
    }

    header {
      background: linear-gradient(to right, red, black);
      padding: 40px;
      font-size: 35px;
      font-weight: bold;
    }

    .card {
      background: #111;
      margin: 10px;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid red;
      display: inline-block;
    }

    section {
      padding: 20px;
    }

    button {
      background: red;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
    }
  </style>
</head>

<body>

<header>🔥 Fortnite Predators 🔥</header>

<section>
  <h2>👑 Leader</h2>
  <div class="card">Sihle Ngongela</div>
</section>

<section>
  <h2>🎯 Members</h2>
  <div class="card">Coming Soon...</div>
</section>

<section>
  <h2>🚀 Join</h2>
  <p>Join our squad via Discord</p>
  <button onclick="alert('Join our Discord!')">Apply</button>
</section>

</body>
</html>
